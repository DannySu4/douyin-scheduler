name: 每日抖音私信发送

on:
  schedule:
    - cron: "0 1 * * *"  # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:     # 支持手动触发

permissions:
  contents: read         # 仅需读取仓库代码权限

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 写入 Cookie
        run: echo "${{ secrets.DOUYIN_COOKIE }}" > cookies.txt

      - name: 运行发送脚本
        env:
          MODE: ${{ secrets.MODE }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          MESSAGE_TEXT: ${{ secrets.MESSAGE_TEXT }}
        run: python douyin_web.py

      - name: 失败时上传调试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            debug-logs/
            *.png
            *.html
