name: 每日抖音私信发送

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 转换 Cookie 为登录状态文件
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
        run: python inject_cookies.py

      - name: 运行主程序
        env:
          MODE: ${{ secrets.MODE }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          MESSAGE_TEXT: ${{ secrets.MESSAGE_TEXT }}
        run: python main.py

      - name: 失败时上传调试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            debug-logs/
            *.png
            *.html
