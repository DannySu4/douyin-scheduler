name: Daily Douyin Scheduler

on:
  # 每天固定时间跑（UTC 时间，下面示例 = 北京时间 09:00）
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 09:00 CST（夏令时注意自行换算）
  # 允许手动触发调试
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run sender
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          MESSAGE_TEXT: ${{ secrets.MESSAGE_TEXT }}
        run: |
          python main.py

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            logs/
            *.png
