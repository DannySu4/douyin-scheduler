name: 每日抖音私信发送

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 写入 Cookie 调试
        run: echo "Cookie 长度: ${#DOUYIN_COOKIE}"
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}

      - name: 运行发送脚本
        env:
          MODE: ${{ secrets.MODE }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          MESSAGE_TEXT: ${{ secrets.MESSAGE_TEXT }}
          DOUYIN_COOKIE: ${{ secrets.DOUUYIN_COOKIE }}
        run: python douyin_web.py

      - name: 失败时上传调试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            debug-logs/
            *.png
            *.html
